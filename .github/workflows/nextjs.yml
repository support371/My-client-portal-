name: Next.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# ⚡ Bolt Optimization: Concurrency control to prevent CI resource exhaustion.
# Automatically cancels older runs when a new commit is pushed to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # ⚡ Bolt: Fail fast to save resources

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: pnpm build
